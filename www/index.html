<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0c0e14">
    <title>基金估值看板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0c0e14;
            --bg-card: #141620;
            --bg-hover: #1a1d2e;
            --bg-input: #1a1d2e;
            --border: #1e2235;
            --text: #e2e4ea;
            --text-2: #8b8fa3;
            --text-3: #5a5e72;
            --up: #ef4444;
            --up-soft: #fca5a5;
            --up-bg: rgba(239,68,68,.08);
            --down: #22c55e;
            --down-soft: #86efac;
            --down-bg: rgba(34,197,94,.08);
            --accent: #6366f1;
            --accent-2: #818cf8;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        /* ── Layout ── */
        .app { 
            max-width: 100%; 
            margin: 0 auto; 
            padding: calc(var(--safe-top) + 12px) 16px calc(var(--safe-bottom) + 60px); 
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
        .header-left .tag {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .status { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-2); }
        .status .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--down); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        .btn-refresh {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 500;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-2);
            cursor: pointer;
            transition: all .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-refresh:active { background: var(--bg-hover); border-color: var(--accent); }

        /* ── Stats Bar ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .stat {
            background: var(--bg-card);
            padding: 14px 12px;
        }
        .stat-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
        .stat-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .stat-sub { font-size: 10px; color: var(--text-3); margin-top: 1px; }

        /* ── Fund List (Card style for mobile) ── */
        .fund-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

        .fund-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            transition: all .15s;
            position: relative;
            overflow: hidden;
        }
        .fund-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
        }
        .fund-card.up::before { background: linear-gradient(90deg, var(--up), #f87171); }
        .fund-card.down::before { background: linear-gradient(90deg, var(--down), #4ade80); }

        .fund-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        .fund-info { flex: 1; min-width: 0; }
        .fund-code {
            font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
            font-size: 11px;
            color: var(--accent-2);
            font-weight: 500;
        }
        .fund-name {
            font-weight: 600;
            font-size: 14px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .fund-del {
            background: none;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 14px;
            -webkit-tap-highlight-color: transparent;
        }
        .fund-del:active { background: var(--up-bg); color: var(--up); }

        .fund-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .fund-metric {
            background: var(--bg);
            border-radius: 8px;
            padding: 10px;
        }
        .fund-metric .label {
            font-size: 10px;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: .04em;
            margin-bottom: 4px;
        }
        .fund-metric .value {
            font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
            font-size: 14px;
            font-weight: 600;
        }
        .fund-metric .sub {
            font-size: 10px;
            color: var(--text-3);
            margin-top: 2px;
        }

        .fund-change {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .change-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 6px;
            font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
            font-size: 13px;
            font-weight: 700;
        }
        .change-badge.up { background: var(--up-bg); color: var(--up); }
        .change-badge.down { background: var(--down-bg); color: var(--down); }
        .change-badge.flat { background: var(--bg); color: var(--text-3); }

        .change-bar-wrap { flex: 1; margin-left: 12px; }
        .change-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-3);
            margin-bottom: 4px;
        }
        .change-bar {
            height: 6px;
            background: var(--bg);
            border-radius: 3px;
            overflow: hidden;
        }
        .change-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .4s ease;
        }
        .change-bar-fill.up { background: var(--up); }
        .change-bar-fill.down { background: var(--down); }

        .fund-time {
            font-size: 10px;
            color: var(--text-3);
            font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
        }

        /* ── Add Form ── */
        .add-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        .add-card h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-2);
        }
        .add-form { display: flex; flex-direction: column; gap: 10px; }
        .add-form input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
            -webkit-appearance: none;
        }
        .add-form input:focus { border-color: var(--accent); }
        .add-form input::placeholder { color: var(--text-3); }
        .btn-add {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-add:active { background: var(--accent-2); transform: scale(.98); }

        /* ── Footer ── */
        .footer {
            text-align: center;
            padding: 20px 0 0;
            font-size: 10px;
            color: var(--text-3);
            line-height: 1.5;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: calc(var(--safe-bottom) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            box-shadow: 0 8px 32px rgba(0,0,0,.5);
            transition: transform .3s cubic-bezier(.4,0,.2,1);
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.ok { border-left: 3px solid var(--down); }
        .toast.err { border-left: 3px solid var(--up); }

        /* ── Loading ── */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Empty ── */
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-3);
        }
        .empty-icon { font-size: 28px; margin-bottom: 10px; }
        .empty p { font-size: 13px; }

        /* ── Pull to refresh indicator ── */
        .ptr-indicator {
            text-align: center;
            padding: 0;
            max-height: 0;
            overflow: hidden;
            transition: all .3s;
            color: var(--text-3);
            font-size: 12px;
        }
        .ptr-indicator.active {
            padding: 12px;
            max-height: 50px;
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <h1>基金估值看板</h1>
            <span class="tag">LIVE</span>
        </div>
        <div class="header-right">
            <div class="status"><span class="dot"></span><span id="lastTime">--:--:--</span></div>
            <button class="btn-refresh" onclick="refresh()">刷新</button>
        </div>
    </header>

    <!-- Stats -->
    <div class="stats">
        <div class="stat"><div class="stat-label">自选</div><div class="stat-value" id="sTotal">--</div><div class="stat-sub">只基金</div></div>
        <div class="stat"><div class="stat-label">上涨</div><div class="stat-value" id="sUp" style="color:var(--up)">--</div><div class="stat-sub">只</div></div>
        <div class="stat"><div class="stat-label">下跌</div><div class="stat-value" id="sDown" style="color:var(--down)">--</div><div class="stat-sub">只</div></div>
        <div class="stat"><div class="stat-label">均涨跌</div><div class="stat-value" id="sAvg">--</div><div class="stat-sub">估算</div></div>
        <div class="stat"><div class="stat-label">最大涨</div><div class="stat-value" id="sMaxUp" style="color:var(--up)">--</div><div class="stat-sub" id="sMaxUpN">--</div></div>
        <div class="stat"><div class="stat-label">最大跌</div><div class="stat-value" id="sMaxDown" style="color:var(--down)">--</div><div class="stat-sub" id="sMaxDownN">--</div></div>
    </div>

    <!-- Fund List -->
    <div class="fund-list" id="fundList">
        <div class="loading"><div class="spinner"></div></div>
    </div>

    <!-- Add -->
    <div class="add-card">
        <h3>添加自选基金</h3>
        <form class="add-form" onsubmit="addFund(event)">
            <input id="inCode" type="number" inputmode="numeric" placeholder="基金代码 (6位数字)" maxlength="6" required>
            <input id="inName" type="text" placeholder="名称 (可选，自动获取)">
            <button class="btn-add" type="submit">添加到自选</button>
        </form>
    </div>

    <div class="footer">数据来源：天天基金网<br>估值仅供参考，以实际净值为准 · 每30秒自动刷新</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── State ── */
let list = [];
let data = {};
let timer = null;

const $ = id => document.getElementById(id);

/* ── Storage (Capacitor Preferences or localStorage fallback) ── */
const Storage = {
    async get(key) {
        try {
            if (window.Capacitor && window.Capacitor.Plugins.Preferences) {
                const { value } = await window.Capacitor.Plugins.Preferences.get({ key });
                return value;
            }
        } catch(e) {}
        return localStorage.getItem(key);
    },
    async set(key, value) {
        try {
            if (window.Capacitor && window.Capacitor.Plugins.Preferences) {
                await window.Capacitor.Plugins.Preferences.set({ key, value });
                return;
            }
        } catch(e) {}
        localStorage.setItem(key, value);
    }
};

/* ── Init ── */
async function init() {
    const saved = await Storage.get('fundWatchlist');
    if (saved) {
        try { list = JSON.parse(saved); } catch(e) { list = []; }
    }
    if (!list.length) {
        list = [
            {c:'000001',n:'华夏成长混合'},
            {c:'110011',n:'易方达中小盘混合'},
            {c:'161725',n:'招商中证白酒指数'},
            {c:'003834',n:'华夏能源革新股票'},
            {c:'012414',n:'东方红启东三年持有混合'},
            {c:'002207',n:'前海开源金银珠宝混合C'}
        ];
        await saveList();
    }
    refresh();
    timer = setInterval(refresh, 30000);
}

async function saveList() {
    await Storage.set('fundWatchlist', JSON.stringify(list));
}

/* ── Toast ── */
function toast(msg, ok=true) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast ' + (ok?'ok':'err') + ' show';
    clearTimeout(t._t);
    t._t = setTimeout(()=> t.classList.remove('show'), 2500);
}

/* ── Fetch (JSONP) ── */
function fetchFund(code) {
    return new Promise(resolve => {
        const cb = '_cb'+code+Date.now();
        const s = document.createElement('script');
        window[cb] = d => { delete window[cb]; s.remove(); resolve(d); };
        s.onerror = ()=> { delete window[cb]; s.remove(); resolve(null); };
        s.src = `https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}&callback=${cb}`;
        document.head.appendChild(s);
    });
}

async function refresh() {
    const promises = list.map(f => fetchFund(f.c));
    const results = await Promise.all(promises);
    data = {};
    results.forEach((d,i) => {
        if (d) {
            data[d.fundcode] = {
                code: d.fundcode,
                name: list[i].n || d.name,
                nav: +d.dwjz,
                est: +d.gsz,
                chg: +d.gszzl,
                navDate: d.jzrq,
                estTime: d.gztime
            };
        }
    });
    render();
    $('lastTime').textContent = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

/* ── Render ── */
function render() {
    const el = $('fundList');
    const vals = Object.values(data);

    if (!list.length) {
        el.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>暂无自选基金<br>在下方添加你关注的基金</p></div>`;
        updateStats([]);
        return;
    }

    el.innerHTML = list.map((f,i) => {
        const d = data[f.c];
        if (!d) return `<div class="fund-card"><div style="color:var(--text-3);padding:8px;font-size:13px">${f.c} · 加载中...</div></div>`;

        const cls = d.chg > 0.005 ? 'up' : d.chg < -0.005 ? 'down' : '';
        const sign = d.chg > 0 ? '+' : '';
        const pct = Math.min(Math.abs(d.chg)/5*100, 100);
        const t = d.estTime ? d.estTime.split(' ')[1]||'' : '';

        return `<div class="fund-card ${cls}">
            <div class="fund-top">
                <div class="fund-info">
                    <div class="fund-code">${d.code}</div>
                    <div class="fund-name">${d.name}</div>
                </div>
                <button class="fund-del" onclick="delFund('${d.code}')">✕</button>
            </div>
            <div class="fund-grid">
                <div class="fund-metric">
                    <div class="label">上日净值</div>
                    <div class="value">${d.nav.toFixed(4)}</div>
                    <div class="sub">${d.navDate}</div>
                </div>
                <div class="fund-metric">
                    <div class="label">估算净值</div>
                    <div class="value" style="color:var(--${cls||'text-2'})">${d.est.toFixed(4)}</div>
                    <div class="sub">实时估算</div>
                </div>
                <div class="fund-metric">
                    <div class="label">估算涨跌</div>
                    <div class="value" style="color:var(--${cls||'text-2'})">${sign}${d.chg.toFixed(2)}%</div>
                    <div class="sub">${t}</div>
                </div>
            </div>
            <div class="fund-change">
                <span class="change-badge ${cls||'flat'}">${sign}${d.chg.toFixed(2)}%</span>
                <div class="change-bar-wrap">
                    <div class="change-bar"><div class="change-bar-fill ${cls}" style="width:${Math.max(pct,2)}%"></div></div>
                </div>
            </div>
        </div>`;
    }).join('');

    updateStats(vals);
}

function updateStats(vals) {
    const total = list.length;
    const up = vals.filter(d=>d.chg>0.005).length;
    const down = vals.filter(d=>d.chg<-0.005).length;
    const avg = vals.length ? vals.reduce((s,d)=>s+d.chg,0)/vals.length : 0;
    const maxUp = vals.length ? vals.reduce((a,d)=>d.chg>a.chg?d:a, vals[0]) : null;
    const maxDown = vals.length ? vals.reduce((a,d)=>d.chg<a.chg?d:a, vals[0]) : null;

    $('sTotal').textContent = total;
    $('sUp').textContent = up;
    $('sDown').textContent = down;

    const avgEl = $('sAvg');
    avgEl.textContent = (avg>0?'+':'') + avg.toFixed(2) + '%';
    avgEl.style.color = avg>0?'var(--up)':avg<0?'var(--down)':'var(--text-2)';

    if (maxUp && maxUp.chg>0) {
        $('sMaxUp').textContent = '+' + maxUp.chg.toFixed(2) + '%';
        $('sMaxUpN').textContent = maxUp.name.length > 6 ? maxUp.name.substring(0,6)+'..' : maxUp.name;
    } else {
        $('sMaxUp').textContent = '--';
        $('sMaxUpN').textContent = '--';
    }

    if (maxDown && maxDown.chg<0) {
        $('sMaxDown').textContent = maxDown.chg.toFixed(2) + '%';
        $('sMaxDownN').textContent = maxDown.name.length > 6 ? maxDown.name.substring(0,6)+'..' : maxDown.name;
    } else {
        $('sMaxDown').textContent = '--';
        $('sMaxDownN').textContent = '--';
    }
}

/* ── Add / Delete ── */
async function addFund(e) {
    e.preventDefault();
    const c = $('inCode').value.trim();
    const n = $('inName').value.trim();
    if (!/^\d{6}$/.test(c)) { toast('请输入正确的6位基金代码',false); return; }
    if (list.some(f=>f.c===c)) { toast('该基金已在列表中',false); return; }
    list.push({c,n});
    await saveList();
    $('inCode').value = '';
    $('inName').value = '';
    toast('已添加 '+c);
    refresh();
}

async function delFund(code) {
    if (!confirm('确认删除 '+code+' ?')) return;
    list = list.filter(f=>f.c!==code);
    delete data[code];
    await saveList();
    toast('已删除 '+code);
    render();
}

/* ── Startup ── */
document.addEventListener('DOMContentLoaded', init);
window.addEventListener('beforeunload', ()=> timer && clearInterval(timer));
</script>
</body>
</html>
